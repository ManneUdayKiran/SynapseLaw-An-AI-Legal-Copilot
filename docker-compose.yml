services:
  api:
    image: python:3.12-slim
    working_dir: /app/backend
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      SECRET_KEY: replace_me_with_a_long_random_secret
      DATABASE_URL: sqlite:///./lexiguide.db
      LLM_PROVIDER: local
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - .:/app
      - lexiguide_storage:/root/.lexiguide/storage

  frontend:
    image: node:22-slim
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app/frontend
    depends_on:
      - api

volumes:
  lexiguide_storage:
